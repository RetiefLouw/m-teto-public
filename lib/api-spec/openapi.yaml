openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: M-Teto API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: providers
    description: Service provider directory
  - name: reviews
    description: Provider reviews and ratings
  - name: cases
    description: Case tracker
  - name: articles
    description: Knowledge base articles
  - name: profile
    description: User profile and onboarding
  - name: points
    description: Gamification points system
  - name: square
    description: The Square marketplace for redeeming points
  - name: quiz
    description: Pop-quiz questions for earning points
  - name: search
    description: AI-powered child-safe search engine
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List all service providers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: province
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: municipality
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersListResponse"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Create a provider (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderBody"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
  /providers/{id}:
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a single provider by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /providers/{id}/officials:
    get:
      operationId: listProviderOfficials
      tags: [providers]
      summary: List officials at a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: onDuty
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of officials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficialsListResponse"

  /officials/{id}/clock-in:
    post:
      operationId: clockInOfficial
      tags: [providers]
      summary: Clock an official in (mark as on duty)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Official clocked in
          content:
            application/json:
              schema:
                type: object
                properties:
                  official:
                    $ref: "#/components/schemas/Official"
        "404":
          description: Official not found

  /officials/{id}/clock-out:
    post:
      operationId: clockOutOfficial
      tags: [providers]
      summary: Clock an official out (mark as off duty)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Official clocked out
          content:
            application/json:
              schema:
                type: object
                properties:
                  official:
                    $ref: "#/components/schemas/Official"
        "404":
          description: Official not found

  /officials/{id}/reviews:
    get:
      operationId: listOfficialReviews
      tags: [reviews]
      summary: Get reviews for a specific official
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reviews for official
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficialReviewsListResponse"
    post:
      operationId: createOfficialReview
      tags: [reviews]
      summary: Submit an Uber-style review for a specific official
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfficialReviewBody"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  review:
                    $ref: "#/components/schemas/OfficialReview"
        "400":
          description: Invalid request

  /providers/{id}/reviews:
    get:
      operationId: listProviderReviews
      tags: [reviews]
      summary: List reviews for a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsListResponse"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review for a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /reviews/{id}/hide:
    patch:
      operationId: hideReview
      tags: [reviews]
      summary: Hide a review (admin moderation)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases for the authenticated user
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasesListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseBody"
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a case by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update case data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseBody"
      responses:
        "200":
          description: Case updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteCase
      tags: [cases]
      summary: Delete a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cases/{id}/checklist:
    patch:
      operationId: updateChecklist
      tags: [cases]
      summary: Update checklist items for a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistBody"
      responses:
        "200":
          description: Checklist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cases/{id}/history:
    get:
      operationId: getCaseHistory
      tags: [cases]
      summary: Get the audit history for a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case history entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseHistoryListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List knowledge base articles
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: moduleType
          in: query
          required: false
          schema:
            type: string
          description: "knowledge_base | university"
        - name: gradeLevel
          in: query
          required: false
          schema:
            type: string
          description: "all | grade_1_2 | grade_3_5 | grade_6_7 | grade_8_12"
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesListResponse"
  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get a single article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the authenticated user's profile (grade, profile type, onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /points:
    get:
      operationId: getPoints
      tags: [points]
      summary: Get the authenticated user's points and transaction history
      responses:
        "200":
          description: Points data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /points/award:
    post:
      operationId: awardPoints
      tags: [points]
      summary: Award points for an action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardPointsBody"
      responses:
        "200":
          description: Points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsAwardedResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /square/items:
    get:
      operationId: listSquareItems
      tags: [square]
      summary: List all available items in The Square marketplace
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of Square items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquareItemsListResponse"

  /square/redeem:
    post:
      operationId: redeemSquareItem
      tags: [square]
      summary: Redeem points for a Square item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemItemBody"
      responses:
        "200":
          description: Item redeemed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResponse"
        "400":
          description: Insufficient points or item unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /square/redemptions:
    get:
      operationId: listRedemptions
      tags: [square]
      summary: List the authenticated user's redemption history
      responses:
        "200":
          description: Redemption history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionsListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /quiz:
    get:
      operationId: listQuizQuestions
      tags: [quiz]
      summary: Get quiz questions (optionally for a specific article or grade)
      parameters:
        - name: articleId
          in: query
          required: false
          schema:
            type: string
        - name: gradeLevel
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Quiz questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizQuestionsListResponse"

  /quiz/answer:
    post:
      operationId: answerQuiz
      tags: [quiz]
      summary: Submit a quiz answer and earn points if correct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuizBody"
      responses:
        "200":
          description: Answer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerQuizResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /search:
    post:
      operationId: aiSearch
      tags: [search]
      summary: AI-powered child-safe search engine query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQuery"
      responses:
        "200":
          description: Search results with AI answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Bearer session token (mobile flow)
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Session cookie (web flow)
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        profileType:
          type: string
          nullable: true
          description: "youth_victim | guardian_adult"
        gradeLevel:
          type: string
          nullable: true
          description: "grade_1_2 | grade_3_5 | grade_6_7 | grade_8_12 | adult"
        totalPoints:
          type: integer
          nullable: true
        onboardingDone:
          type: integer
          nullable: true

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DeleteResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Provider:
      type: object
      required: [id, name, type, address, province, suburb, contactNumber]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          description: "police_station | court | hospital | clinic | doctor_office | thuthuzela_care_centre | shelter | social_worker | legal_aid | counsellor | srhr_practitioner"
        address:
          type: string
        suburb:
          type: string
        municipality:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        province:
          type: string
        contactNumber:
          type: string
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        operatingHours:
          type: string
          nullable: true
        averageRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    Official:
      type: object
      required: [id, providerId, name, title, role, isOnDuty]
      properties:
        id:
          type: string
        providerId:
          type: string
        name:
          type: string
        title:
          type: string
        role:
          type: string
          description: "frontline | supervisor | manager | director"
        unit:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        badgeNumber:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        isOnDuty:
          type: boolean
        clockedInAt:
          type: string
          format: date-time
          nullable: true
        clockedOutAt:
          type: string
          format: date-time
          nullable: true
        averageScore:
          type: number
          nullable: true
        reviewCount:
          type: integer
        flagCount:
          type: integer
        recognitionCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    OfficialReview:
      type: object
      required: [id, officialId, providerId, score, isAnonymous, createdAt]
      properties:
        id:
          type: string
        officialId:
          type: string
        providerId:
          type: string
        sessionId:
          type: string
          nullable: true
        score:
          type: integer
